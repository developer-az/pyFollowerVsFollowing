[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osint-kit"
version = "0.1.0"
description = "A passive, lawful OSINT toolkit: follower diffs, DNS/WHOIS recon, header and log analysis, and more."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "developer-az" }]
keywords = ["osint", "security", "dns", "rdap", "logs", "exif", "instagram"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "rich>=13.7",
]

[project.optional-dependencies]
tui = [
  "textual>=8.2",
]
dev = [
  "hypothesis>=6.98",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "textual>=8.2",
]

[project.scripts]
osint-kit = "osint_kit.cli:main"

[project.entry-points."osint_kit.plugins"]
social_diff = "osint_kit.plugins.social_diff:SocialDiffPlugin"
domain_recon = "osint_kit.plugins.domain_recon:DomainReconPlugin"
rdap = "osint_kit.plugins.rdap:RdapPlugin"
email_headers = "osint_kit.plugins.email_headers:EmailHeadersPlugin"
exif = "osint_kit.plugins.exif:ExifPlugin"
log_analyzer = "osint_kit.plugins.log_analyzer:LogAnalyzerPlugin"
hashing = "osint_kit.plugins.hashing:HashingPlugin"
username_check = "osint_kit.plugins.username_check:UsernameCheckPlugin"

[project.urls]
Homepage = "https://github.com/developer-az/pyFollowerVsFollowing"
Issues = "https://github.com/developer-az/pyFollowerVsFollowing/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
  "--import-mode=importlib",
  "-ra",
  "--strict-markers",
  "--strict-config",
]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "benchmark: timing comparisons (kept small in CI; see benchmarks/ for the 100k run)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["osint_kit"]
branch = true
omit = ["src/osint_kit/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ARG", "RUF"]
ignore = [
  # Long URLs and fixture paths read better than forced wrapping.
  "E501",
  # The plugin protocol mirrors third-party shapes; not every arg is used by every stub.
  "ARG002",
]

[tool.ruff.lint.isort]
known-first-party = ["osint_kit"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
mypy_path = "src"
explicit_package_bases = true
files = ["src/osint_kit", "tests", "benchmarks"]
exclude = ["^\\.venv/"]

[[tool.mypy.overrides]]
module = ["tests.*", "benchmarks.*"]
# Tests are typed, but fixtures and parametrisation resist full strictness.
disallow_untyped_decorators = false
